services:
  - type: web
    name: automecastore-api
    runtime: docker
    rootDir: Backend/automecastore
    envVars:
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: DB_NAME
        fromDatabase:
          name: automecastore-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: automecastore-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: automecastore-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: automecastore-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: automecastore-db
          property: port
      - key: ALLOWED_HOSTS
        value: automecastore-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://automecastore.vercel.app
      - key: SITE_URL
        value: https://automecastore-api.onrender.com

  - type: psdb
    name: automecastore-db
    plan: free
