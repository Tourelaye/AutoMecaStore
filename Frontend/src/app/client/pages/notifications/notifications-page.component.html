<section class="notifications-page">
  <div class="container">
    <div class="page-header">
      <h1>Historique des notifications</h1>
      <button class="btn-mark-all" (click)="markAllRead()" *ngIf="unreadCount > 0">
        Tout marquer comme lu
      </button>
    </div>

    <div class="notif-list">
      <div class="loading" *ngIf="loading">
        Chargement…
      </div>

      <div class="empty" *ngIf="!loading && notifications.length === 0">
        <i class="bi bi-bell-slash"></i>
        <p>Aucune notification pour le moment.</p>
      </div>

      <div
        class="notif-item"
        *ngFor="let notif of notifications"
        [class.unread]="!notif.lu"
        [class.important-danger]="notif.importance === 'danger'"
        [class.important-warning]="notif.importance === 'warning'"
        (click)="onNotificationClick(notif)"
      >
        <i class="bi icon" [ngClass]="getIconClass(notif.importance)"></i>
        <div class="notif-content">
          <strong class="notif-title">{{ notif.titre || notif.type }}</strong>
          <p class="notif-message">{{ notif.message }}</p>
          <div class="notif-meta">
            <span class="notif-type">{{ notif.type }}</span>
            <span class="notif-date">{{ notif.created_at }}</span>
          </div>
        </div>
        <button class="delete-btn" (click)="delete(notif, $event)" aria-label="Supprimer">
          <i class="bi bi-x"></i>
        </button>
      </div>
    </div>

    <div class="load-more" *ngIf="!loading && notifications.length === limit">
      <button (click)="loadMore()">Charger plus</button>
    </div>
  </div>
</section>
