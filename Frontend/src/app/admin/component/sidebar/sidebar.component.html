<aside class="sidebar" [class.collapsed]="isCollapsed">

  <!-- ══ PROFIL ══ -->
  <div class="sidebar-profile" [class.profile-collapsed]="isCollapsed">
    <div class="profile-av">{{ adminInfo.initiales }}</div>

    <div class="profile-details" *ngIf="!isCollapsed">
      <strong>{{ adminInfo.nom }}</strong>
      <span>{{ adminInfo.role }}</span>
    </div>

    <div class="online-pill" *ngIf="!isCollapsed">
      <span class="dot"></span> En ligne
    </div>
  </div>

  <!-- ══ NAVIGATION ══ -->
  <nav class="sidebar-nav">

    <!-- GESTION -->
    <p class="nav-section-label" *ngIf="!isCollapsed">Gestion</p>
    <ul class="nav-list">
      <li *ngFor="let item of gestionMenuItems" class="nav-item">
        <a
          class="nav-link"
          [routerLink]="item.route"
          routerLinkActive="active"
          [title]="isCollapsed ? item.label : ''"
        >
          <span class="nav-icon-wrap">
            <i class="bi {{ item.icon }}"></i>
            <span class="nav-badge" *ngIf="item.badge && item.badge > 0 && isCollapsed">{{ item.badge }}</span>
          </span>
          <span class="nav-text" *ngIf="!isCollapsed">{{ item.label }}</span>
          <span
            class="badge"
            *ngIf="item.badge && item.badge > 0 && !isCollapsed"
            [class.pulse]="item.badge > 0"
            [class.high-count]="item.badge >= 10"
          >{{ item.badge }}</span>
        </a>
      </li>
    </ul>

    <!-- ANALYSE & OUTILS -->
    <p class="nav-section-label" *ngIf="!isCollapsed">Analyse & Outils</p>
    <ul class="nav-list">
      <li *ngFor="let item of analyseMenuItems" class="nav-item">
        <a
          class="nav-link"
          [routerLink]="item.route"
          routerLinkActive="active"
          [title]="isCollapsed ? item.label : ''"
        >
          <span class="nav-icon-wrap">
            <i class="bi {{ item.icon }}"></i>
          </span>
          <span class="nav-text" *ngIf="!isCollapsed">{{ item.label }}</span>
          <span
            class="badge"
            *ngIf="item.badge && item.badge > 0 && !isCollapsed"
            [class.pulse]="item.badge > 0"
            [class.high-count]="item.badge >= 10"
          >{{ item.badge }}</span>
        </a>
      </li>
    </ul>

    <!-- COMPTE -->
    <p class="nav-section-label" *ngIf="!isCollapsed">Compte</p>
    <ul class="nav-list">
      <li *ngFor="let item of compteMenuItems" class="nav-item">
        <a
          class="nav-link"
          [routerLink]="item.route"
          routerLinkActive="active"
          [title]="isCollapsed ? item.label : ''"
        >
          <span class="nav-icon-wrap">
            <i class="bi {{ item.icon }}"></i>
          </span>
          <span class="nav-text" *ngIf="!isCollapsed">{{ item.label }}</span>
        </a>
      </li>
    </ul>

  </nav>

  <!-- ══ FOOTER ══ -->
  <div class="sidebar-footer">

    <div class="sidebar-version" *ngIf="!isCollapsed">
      <i class="bi bi-cpu"></i>
      <span>AutoMecaStore v2.0</span>
    </div>

    <button class="logout-btn" (click)="logout()" [title]="isCollapsed ? 'Déconnexion' : ''">
      <i class="bi bi-box-arrow-left"></i>
      <span *ngIf="!isCollapsed">Déconnexion</span>
    </button>

  </div>

</aside>
