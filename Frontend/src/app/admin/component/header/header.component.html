<header class="admin-header">

  <!-- SEARCH -->
  <div class="search-box">
    <i class="bi bi-search search-icon"></i>
    <input
      type="text"
      placeholder="Rechercher un produit, commande, client..."
      [(ngModel)]="searchQuery"
      (keyup.enter)="onSearch()"
    >
    <button class="search-clear" *ngIf="searchQuery" (click)="searchQuery = ''">
      <i class="bi bi-x"></i>
    </button>
    <span class="search-shortcut" *ngIf="!searchQuery">⌘K</span>
  </div>

  <!-- DROITE -->
  <div class="header-right">

    <!-- HORLOGE -->
    <div class="clock">
      <i class="bi bi-clock"></i>
      {{ formatTime(currentTime) }}
    </div>

    <!-- SÉPARATEUR -->
    <div class="h-sep"></div>

    <!-- NOTIFICATIONS -->
    <app-admin-notification-bell></app-admin-notification-bell>

    <!-- USER MENU -->
    <div class="user-menu-wrapper">
      <button class="user-btn" (click)="toggleUserMenu()" [class.active]="showUserMenu">
        <div class="user-av">{{ adminInfo.initiales }}</div>
        <div class="user-info">
          <span class="user-name">{{ adminInfo.nom }}</span>
          <span class="user-role">{{ adminInfo.role }}</span>
        </div>
        <i class="bi bi-chevron-down chev" [class.rotate]="showUserMenu"></i>
      </button>

      <div class="user-dropdown" *ngIf="showUserMenu">

        <div class="user-dropdown-header">
          <div class="udh-av">{{ adminInfo.initiales }}</div>
          <div class="udh-info">
            <strong>{{ adminInfo.nom }}</strong>
            <small>{{ adminInfo.email }}</small>
            <span class="role-pill">{{ adminInfo.role }}</span>
          </div>
        </div>

        <div class="user-dropdown-menu">
          <a class="udm-item" routerLink="/admin/profil">
            <div class="udm-icon icon-orange"><i class="bi bi-person-fill"></i></div>
            <div class="udm-text">
              <span>Mon profil</span>
              <small>Infos personnelles</small>
            </div>
            <i class="bi bi-chevron-right udm-arrow"></i>
          </a>
          <a class="udm-item" routerLink="/admin/securite">
            <div class="udm-icon icon-blue"><i class="bi bi-shield-lock-fill"></i></div>
            <div class="udm-text">
              <span>Sécurité</span>
              <small>Mot de passe & accès</small>
            </div>
            <i class="bi bi-chevron-right udm-arrow"></i>
          </a>
          <a class="udm-item" routerLink="/admin/parametres">
            <div class="udm-icon icon-green"><i class="bi bi-gear-fill"></i></div>
            <div class="udm-text">
              <span>Paramètres</span>
              <small>Configuration</small>
            </div>
            <i class="bi bi-chevron-right udm-arrow"></i>
          </a>
        </div>

        <div class="udm-divider"></div>

        <button class="udm-logout" (click)="logout()">
          <i class="bi bi-box-arrow-right"></i>
          <span>Déconnexion</span>
        </button>

      </div>
    </div>

  </div>
</header>
