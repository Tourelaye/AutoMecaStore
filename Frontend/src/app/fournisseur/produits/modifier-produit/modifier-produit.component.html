<div class="modifier-produit-container">
  <div class="page-header">
    <h1>Modifier le produit #{{produitId}}</h1>
    <p class="page-subtitle">Modifiez les informations du produit</p>
  </div>

  <div class="form-card">
    <form (ngSubmit)="onSubmit()">
      <div class="form-section">
        <h3>Informations générales</h3>
        
        <div class="form-group">
          <label for="nom">Nom du produit *</label>
          <input type="text" id="nom" [(ngModel)]="produit.nom" name="nom" required>
        </div>

        <div class="form-group">
          <label for="description">Description</label>
          <textarea id="description" [(ngModel)]="produit.description" name="description" rows="4"></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="categorie">Catégorie *</label>
            <select id="categorie" [(ngModel)]="produit.categorie" name="categorie" required>
              <option *ngFor="let cat of categories" [value]="cat">{{cat}}</option>
            </select>
          </div>

          <div class="form-group">
            <label for="marque">Marque</label>
            <input type="text" id="marque" [(ngModel)]="produit.marque" name="marque">
          </div>
        </div>

        <div class="form-group">
          <label for="reference">Référence</label>
          <input type="text" id="reference" [(ngModel)]="produit.reference" name="reference">
        </div>
      </div>

      <div class="form-section">
        <h3>Prix et stock</h3>
        
        <div class="form-row">
          <div class="form-group">
            <label for="prix">Prix (€) *</label>
            <input type="number" id="prix" [(ngModel)]="produit.prix" name="prix" required min="0" step="0.01">
          </div>

          <div class="form-group">
            <label for="stock">Stock *</label>
            <input type="number" id="stock" [(ngModel)]="produit.stock" name="stock" required min="0">
          </div>
        </div>
      </div>

      <div class="form-section">
        <h3>Image du produit</h3>
        
        <div class="image-upload">
          <div class="upload-area" [class.has-file]="produit.image">
            <input type="file" id="image" (change)="onFileSelected($event)" accept="image/*" class="file-input">
            <label for="image" class="upload-label">
              <i class="bi bi-cloud-upload"></i>
              <span *ngIf="!produit.image">Changer l'image</span>
              <span *ngIf="produit.image">{{produit.image.name}}</span>
            </label>
          </div>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-secondary" (click)="onCancel()">
          <i class="bi bi-x-lg"></i>
          Annuler
        </button>
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-check-lg"></i>
          Enregistrer les modifications
        </button>
      </div>
    </form>
  </div>
</div>
