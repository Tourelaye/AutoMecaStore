<div class="produits-container">
  <div class="page-header">
    <h1>Mes Produits</h1>
    <p class="page-subtitle">Gérez votre catalogue de produits</p>
  </div>

  <!-- Actions Bar -->
  <div class="actions-bar">
    <div class="search-filters">
      <div class="search-box">
        <i class="bi bi-search"></i>
        <input type="text" placeholder="Rechercher un produit..." [(ngModel)]="searchTerm">
      </div>
      <select class="filter-select" [(ngModel)]="selectedCategorie" (change)="onCategorieChange(selectedCategorie)">
        <option value="">Toutes les catégories</option>
        <option *ngFor="let cat of categories" [value]="cat">{{cat}}</option>
      </select>
    </div>
    <button routerLink="/fournisseur/produits/ajouter" class="btn btn-primary">
      <i class="bi bi-plus-lg"></i>
      Ajouter un produit
    </button>
  </div>

  <!-- Products Table -->
  <div class="table-card">
    <div class="table-responsive">
      <table class="table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nom</th>
            <th>Catégorie</th>
            <th>Prix</th>
            <th>Stock</th>
            <th>Statut</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let produit of filteredProduits">
            <td>#{{produit.id}}</td>
            <td>
              <a routerLink="/fournisseur/produits/{{produit.id}}" class="product-link">
                {{produit.nom}}
              </a>
            </td>
            <td>{{produit.categorie}}</td>
            <td>{{produit.prix | number:'1.2-2'}} €</td>
            <td>
              <span class="stock-indicator {{getStockClass(produit.stock)}}">
                {{produit.stock}}
              </span>
            </td>
            <td><span class="badge {{getStatutClass(produit.statut)}}">{{produit.statut}}</span></td>
            <td>
              <div class="action-buttons">
                <button class="btn-icon btn-view" routerLink="/fournisseur/produits/{{produit.id}}" title="Voir">
                  <i class="bi bi-eye"></i>
                </button>
                <button class="btn-icon btn-edit" (click)="modifierProduit(produit.id)" title="Modifier">
                  <i class="bi bi-pencil"></i>
                </button>
                <button class="btn-icon btn-delete" (click)="supprimerProduit(produit.id)" title="Supprimer">
                  <i class="bi bi-trash"></i>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    
    <div class="table-footer">
      <p>Affichage de {{filteredProduits.length}} produit(s)</p>
    </div>
  </div>
</div>
