<div class="fournisseur-notification-bell">
  <button class="bell-btn" (click)="toggle()" [class.active]="open">
    <i class="bi bi-bell"></i>
    <span class="badge" *ngIf="unreadCount > 0">{{ unreadCount > 9 ? '9+' : unreadCount }}</span>
  </button>

  <div class="notifications-dropdown" *ngIf="open">
    <div class="dropdown-header">
      <h4>Notifications</h4>
      <button class="mark-read-btn" (click)="markAllRead($event)" *ngIf="unreadCount > 0">
        Tout marquer comme lu
      </button>
    </div>

    <div class="dropdown-content">
      <div *ngIf="loading" class="loading">
        <div class="spinner"></div>
      </div>

      <div *ngIf="!loading && notifications.length === 0" class="empty">
        <i class="bi bi-bell-slash"></i>
        <p>Aucune notification</p>
      </div>

      <div class="notification-list" *ngIf="!loading && notifications.length > 0">
        <div
          class="notification-item"
          *ngFor="let notif of notifications"
          [class.unread]="!notif.lu"
          (click)="onNotificationClick(notif)"
        >
          <div class="notif-icon">
            <i class="bi" [ngClass]="getIcon(notif.type)"></i>
          </div>
          <div class="notif-content">
            <p class="notif-message">{{ notif.message }}</p>
            <span class="notif-time">{{ timeAgo(notif.created_at) }}</span>
          </div>
          <button class="notif-delete" (click)="delete($event, notif)">
            <i class="bi bi-x"></i>
          </button>
        </div>
      </div>
    </div>

    <div class="dropdown-footer">
      <button class="voir-toutes-btn" (click)="voirToutes()">
        Voir toutes les notifications
      </button>
    </div>
  </div>
</div>
