<div class="ams-rail" [class.has-prev]="canPrev" [class.has-next]="canNext">

  <button
    type="button"
    class="ams-rail-arrow prev"
    aria-label="Produits précédents"
    [disabled]="!canPrev"
    (click)="scroll(-1)"
  >
    <i class="bi bi-chevron-left"></i>
  </button>

  <div
    #track
    class="ams-rail-track"
    role="list"
    [attr.aria-label]="ariaLabel"
    (scroll)="onScroll()"
  >
    <ng-content></ng-content>
  </div>

  <button
    type="button"
    class="ams-rail-arrow next"
    aria-label="Produits suivants"
    [disabled]="!canNext"
    (click)="scroll(1)"
  >
    <i class="bi bi-chevron-right"></i>
  </button>

</div>
