<section class="categories">
  <div class="container">

    <h2 class="title">Acheter par catégorie</h2>
    <p class="subtitle">Explorez nos catégories de produits premium</p>

    <!-- SKELETON LOADING -->
    <div class="cards" *ngIf="isLoading">
      <div class="card skeleton" *ngFor="let i of [1,2,3,4]">
        <div class="skeleton-icon"></div>
        <div class="skeleton-line"></div>
        <div class="skeleton-line short"></div>
        <div class="skeleton-line count"></div>
      </div>
    </div>

    <!-- ERREUR -->
    <div class="error-state" *ngIf="errorMessage && !isLoading">
      <i class="bi bi-exclamation-circle"></i> {{ errorMessage }}
    </div>

    <!-- CARDS CATEGORIES -->
    <div class="cards" *ngIf="!isLoading && !errorMessage">

      <div
        class="card {{ cat.visuel.cssClass }}"
        *ngFor="let cat of categories"
        [routerLink]="cat.visuel.route"
        style="cursor: pointer;"
      >
        <!-- BADGE (ex: 🔥 Tendance) -->
        <span class="badge" *ngIf="cat.visuel.badge">
          {{ cat.visuel.badge }}
        </span>

        <!-- ICON -->
        <div class="icon">
          <i [class]="cat.visuel.icon"></i>
        </div>

        <!-- NOM -->
        <h3>{{ cat.nom }}</h3>

        <!-- SOUS-TITRE -->
        <p>{{ cat.visuel.sousTitre }}</p>

        <!-- COMPTEUR -->
        <div class="count">{{ cat.visuel.mockCount }}</div>
        <small>produits disponibles</small>

        <!-- ÉTAT (désactivé si etat = false) -->
        <div class="inactive-overlay" *ngIf="cat.etat === 'false'">
          <i class="bi bi-lock"></i> Indisponible
        </div>

      </div>

    </div>

    <!-- AUCUNE CATEGORIE -->
    <div class="empty-state" *ngIf="!isLoading && !errorMessage && categories.length === 0">
      <i class="bi bi-folder-x"></i>
      <p>Aucune catégorie disponible pour le moment.</p>
    </div>

  </div>
</section>
