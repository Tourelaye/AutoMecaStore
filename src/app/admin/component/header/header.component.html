<header class="admin-header">

  <!-- SEARCH -->
  <div class="search-box">
    <i class="bi bi-search search-icon"></i>
    <input
      type="text"
      placeholder="Rechercher un produit, commande, client..."
      [(ngModel)]="searchQuery"
      (keyup.enter)="onSearch()"
    >
    <button class="search-clear" *ngIf="searchQuery" (click)="searchQuery = ''">
      <i class="bi bi-x"></i>
    </button>
    <span class="search-shortcut" *ngIf="!searchQuery">⌘K</span>
  </div>

  <!-- DROITE -->
  <div class="header-right">

    <!-- HORLOGE -->
    <div class="clock">
      <i class="bi bi-clock"></i>
      {{ formatTime(currentTime) }}
    </div>

    <!-- SÉPARATEUR -->
    <div class="h-sep"></div>

    <!-- NOTIFICATIONS -->
    <div class="notif-wrapper">
      <button class="icon-btn" (click)="toggleNotifications()" [class.active]="showNotifications">
        <i class="bi bi-bell"></i>
        <span class="notif-badge" *ngIf="unreadCount > 0">{{ unreadCount }}</span>
      </button>

      <div class="notif-dropdown" *ngIf="showNotifications">

        <div class="notif-header">
          <div class="notif-title">
            <i class="bi bi-bell-fill"></i>
            Notifications
            <span class="unread-pill" *ngIf="unreadCount > 0">{{ unreadCount }}</span>
          </div>
          <button class="mark-read-btn" (click)="markAllRead()" *ngIf="unreadCount > 0">
            <i class="bi bi-check2-all"></i> Tout lire
          </button>
        </div>

        <div class="notif-list">
          <div
            class="notif-item"
            *ngFor="let n of notifications"
            [class.unread]="!n.read"
          >
            <div class="notif-icon-wrap" [style.background]="getNotifColor(n.type) + '20'">
              <i class="bi {{ getNotifIcon(n.type) }}" [style.color]="getNotifColor(n.type)"></i>
            </div>
            <div class="notif-content">
              <p>{{ n.message }}</p>
              <small><i class="bi bi-clock"></i> {{ n.time }}</small>
            </div>
            <div class="notif-dot" *ngIf="!n.read"></div>
          </div>
        </div>

        <div class="notif-footer">
          <button>
            <i class="bi bi-arrow-right-circle-fill"></i>
            Voir toutes les notifications
          </button>
        </div>

      </div>
    </div>

    <!-- USER MENU -->
    <div class="user-menu-wrapper">
      <button class="user-btn" (click)="toggleUserMenu()" [class.active]="showUserMenu">
        <div class="user-av">{{ adminInfo.initiales }}</div>
        <div class="user-info">
          <span class="user-name">{{ adminInfo.nom }}</span>
          <span class="user-role">{{ adminInfo.role }}</span>
        </div>
        <i class="bi bi-chevron-down chev" [class.rotate]="showUserMenu"></i>
      </button>

      <div class="user-dropdown" *ngIf="showUserMenu">

        <div class="user-dropdown-header">
          <div class="udh-av">{{ adminInfo.initiales }}</div>
          <div class="udh-info">
            <strong>{{ adminInfo.nom }}</strong>
            <small>{{ adminInfo.email || 'admin@automeca.com' }}</small>
            <span class="role-pill">{{ adminInfo.role }}</span>
          </div>
        </div>

        <div class="user-dropdown-menu">
          <a class="udm-item" routerLink="/admin/profil">
            <div class="udm-icon icon-orange"><i class="bi bi-person-fill"></i></div>
            <div class="udm-text">
              <span>Mon profil</span>
              <small>Infos personnelles</small>
            </div>
            <i class="bi bi-chevron-right udm-arrow"></i>
          </a>
          <a class="udm-item" routerLink="/admin/securite">
            <div class="udm-icon icon-blue"><i class="bi bi-shield-lock-fill"></i></div>
            <div class="udm-text">
              <span>Sécurité</span>
              <small>Mot de passe & accès</small>
            </div>
            <i class="bi bi-chevron-right udm-arrow"></i>
          </a>
          <a class="udm-item" routerLink="/admin/parametres">
            <div class="udm-icon icon-green"><i class="bi bi-gear-fill"></i></div>
            <div class="udm-text">
              <span>Paramètres</span>
              <small>Configuration</small>
            </div>
            <i class="bi bi-chevron-right udm-arrow"></i>
          </a>
        </div>

        <div class="udm-divider"></div>

        <button class="udm-logout" (click)="logout()">
          <i class="bi bi-box-arrow-right"></i>
          <span>Déconnexion</span>
        </button>

      </div>
    </div>

  </div>
</header>
