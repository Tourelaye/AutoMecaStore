services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: automecastore_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d automecastore_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DEBUG: "True"
      SECRET_KEY: dev-local-docker-secret-key
      DB_NAME: automecastore_dev
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: "5432"
      ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0
      CORS_ALLOWED_ORIGINS: http://localhost:4200,http://127.0.0.1:4200
      CSRF_TRUSTED_ORIGINS: http://localhost:4200,http://127.0.0.1:4200
      SITE_URL: http://127.0.0.1:8000
      PORT: "8000"
    volumes:
      - ./media:/app/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
